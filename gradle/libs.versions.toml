[versions]
agp                     = "8.6.0"
kotlin                  = "2.0.21"
ksp                     = "2.0.21-1.0.27"
coreKtx                 = "1.13.1"
activityCompose         = "1.9.3"
composeBom              = "2024.11.00"
lifecycleViewmodelCompose = "2.10.0"
retrofit                = "3.0.0"
converterGson           = "3.0.0"
okhttp                  = "4.12.0"
ioCoilVersion           = "2.7.0"
ui                      = "1.10.2"
navigationCompose       = "2.8.5"
iconsExtended           = "1.7.8"
room                    = "2.6.1"
hilt                    = "2.53"
hiltNavigationCompose   = "1.2.0"
datastore               = "1.1.1"
mapbox                  = "10.16.0"

[libraries]
# Core
androidx-core-ktx               = { group = "androidx.core",      name = "core-ktx",           version.ref = "coreKtx" }
androidx-activity-compose       = { group = "androidx.activity",  name = "activity-compose",   version.ref = "activityCompose" }
androidx-compose-bom            = { group = "androidx.compose",   name = "compose-bom",        version.ref = "composeBom" }
androidx-ui                     = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics            = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling             = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3              = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
# Lifecycle
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version = "2.8.7" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Icons
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "iconsExtended" }

# Retrofit
com-squareup-retrofit2-retrofit      = { group = "com.squareup.retrofit2", name = "retrofit",        version.ref = "retrofit" }
com-squareup-retrofit2-converter-json = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converterGson" }
okhttp-logging                        = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# Hilt
hilt-android            = { group = "com.google.dagger",  name = "hilt-android",          version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger",  name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",      name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coil
io-coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "ioCoilVersion" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Mapbox v10 Stable
mapbox-android = { group = "com.mapbox.maps", name = "android", version.ref = "mapbox" }
mapbox-plugin-annotation = { group = "com.mapbox.maps", name = "plugin-annotation", version.ref = "mapbox" }

[plugins]
android-application = { id = "com.android.application",        version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",        version.ref = "ksp" }